[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genoscan"
version = "0.1.0"
description = "Scan genomic data files (VCF, FASTQ) for metadata that could identify people before you share them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anthony Baker" }]
requires-python = ">=3.9"
dependencies = []  # v0.1 uses only the Python standard library
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
# This line is what makes the `genoscan` command exist after install.
genoscan = "genoscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
